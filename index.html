    <!-- ========== 跳转逻辑：特性检测 & 加载超时（ES5 兼容） ========== -->
    <script>
        (function() {
            // ----- 1. 全面特性检测（覆盖老旧浏览器、IE、早期 Safari/WebView） -----
            if (typeof Promise === 'undefined' ||
                typeof fetch === 'undefined' ||
                typeof requestAnimationFrame === 'undefined') {
                location.href = 'https://wzml.cc.cd/old';
                return;
            }

            // ----- 2. 加载超时检测（15 秒） -----
            var timeoutId = setTimeout(function() {
                location.href = 'https://wzml.cc.cd/old';
            }, 15000);

            function clearRedirect() {
                clearTimeout(timeoutId);
            }
            if (window.addEventListener) {
                window.addEventListener('load', clearRedirect, false);
            } else if (window.attachEvent) {
                window.attachEvent('onload', clearRedirect);
            } else {
                window.onload = clearRedirect;
            }
        })();
    </script>

    <!-- ========== UA 检测与展示脚本 ========== -->
    <script>
        (function() {
            // ---------- 工具函数 ----------
            function getBrowserInfo() {
                var ua = navigator.userAgent;
                var browser = 'Unknown',
                    version = 'Unknown',
                    engine = 'Unknown';
                // 浏览器识别
                if (ua.indexOf('Edg') > -1) {
                    browser = 'Edge';
                    var m = ua.match(/Edg\/(\d+\.\d+\.\d+\.\d+)/);
                    if (m) version = m[1];
                } else if (ua.indexOf('Chrome') > -1 && ua.indexOf('Edg') === -1) {
                    browser = 'Chrome';
                    var m = ua.match(/Chrome\/(\d+\.\d+\.\d+\.\d+)/);
                    if (m) version = m[1];
                } else if (ua.indexOf('Firefox') > -1) {
                    browser = 'Firefox';
                    var m = ua.match(/Firefox\/(\d+\.\d+)/);
                    if (m) version = m[1];
                } else if (ua.indexOf('Safari') > -1 && ua.indexOf('Chrome') === -1) {
                    browser = 'Safari';
                    var m = ua.match(/Version\/(\d+\.\d+)/);
                    if (m) version = m[1];
                } else if (ua.indexOf('MSIE') > -1 || ua.indexOf('Trident') > -1) {
                    browser = 'Internet Explorer';
                    var m = ua.match(/(?:MSIE |rv:)(\d+\.\d+)/);
                    if (m) version = m[1];
                } else if (ua.indexOf('Opera') > -1 || ua.indexOf('OPR') > -1) {
                    browser = 'Opera';
                    var m = ua.match(/(?:Opera|OPR)\/(\d+\.\d+)/);
                    if (m) version = m[1];
                }

                // 渲染引擎
                if (ua.indexOf('WebKit') > -1) engine = 'WebKit';
                else if (ua.indexOf('Gecko') > -1) engine = 'Gecko';
                else if (ua.indexOf('Trident') > -1) engine = 'Trident';
                else if (ua.indexOf('Presto') > -1) engine = 'Presto';

                // 操作系统
                var os = 'Unknown';
                if (ua.indexOf('Windows NT 10.0') > -1) os = 'Windows 10';
                else if (ua.indexOf('Windows NT 6.1') > -1) os = 'Windows 7';
                else if (ua.indexOf('Windows NT 6.2') > -1) os = 'Windows 8';
                else if (ua.indexOf('Windows NT 6.3') > -1) os = 'Windows 8.1';
                else if (ua.indexOf('Windows') > -1) os = 'Windows';
                else if (ua.indexOf('Mac OS X') > -1) os = 'macOS';
                else if (ua.indexOf('Linux') > -1) os = 'Linux';
                else if (ua.indexOf('Android') > -1) os = 'Android';
                else if (ua.indexOf('iPhone') > -1) os = 'iOS (iPhone)';
                else if (ua.indexOf('iPad') > -1) os = 'iOS (iPad)';
                else if (ua.indexOf('iPod') > -1) os = 'iOS (iPod)';

                return { browser: browser, version: version, engine: engine, os: os, ua: ua };
            }

            // ---------- 获取详细检测数据 ----------
            function getDetailedInfo() {
                var info = {};
                var ua = navigator.userAgent;

                // 基础
                info['User-Agent'] = ua;
                var bi = getBrowserInfo();
                info['浏览器'] = bi.browser + ' ' + bi.version;
                info['渲染引擎'] = bi.engine;
                info['操作系统'] = bi.os;
                info['平台'] = navigator.platform || 'Unknown';
                var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);
                var isTablet = /iPad|Tablet/i.test(ua);
                if (isTablet) info['设备类型'] = '平板 (Tablet)';
                else if (isMobile) info['设备类型'] = '移动端 (Mobile)';
                else info['设备类型'] = '桌面端 (Desktop)';

                // 屏幕
                info['屏幕分辨率'] = screen.width + ' × ' + screen.height;
                info['可用屏幕尺寸'] = screen.availWidth + ' × ' + screen.availHeight;
                info['颜色深度'] = screen.colorDepth + ' bit';
                info['像素深度'] = screen.pixelDepth + ' bit';
                info['设备像素比'] = window.devicePixelRatio || 1;

                // 浏览器特性
                info['语言'] = navigator.language || navigator.userLanguage || 'Unknown';
                try { info['时区'] = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { info['时区'] =
                    'Unavailable'; }
                info['是否在线'] = navigator.onLine ? '在线' : '离线';

                // 连接信息（可能不支持）
                if (navigator.connection) {
                    var conn = navigator.connection;
                    info['网络类型'] = conn.effectiveType || 'Unknown';
                    info['下行速度'] = (conn.downlink ? conn.downlink + ' Mbps' : 'N/A');
                    info['RTT'] = (conn.rtt ? conn.rtt + ' ms' : 'N/A');
                } else {
                    info['网络类型'] = 'Not available';
                }

                // 设备内存（可能不支持）
                if (navigator.deviceMemory) {
                    info['设备内存'] = navigator.deviceMemory + ' GB';
                } else {
                    info['设备内存'] = 'Not available';
                }

                // 触屏支持
                var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);
                info['触屏支持'] = isTouch ? '是 (最多 ' + (navigator.maxTouchPoints || '?') + ' 点)' : '否';

                // Cookie 支持
                info['Cookie 启用'] = navigator.cookieEnabled ? '是' : '否';

                // WebGL 支持与 GPU
                var webglSupport = false;
                var gpu = 'Not available';
                try {
                    var canvas = document.createElement('canvas');
                    var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (gl) {
                        webglSupport = true;
                        var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                        if (debugInfo) {
                            gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || 'Unknown GPU';
                        } else {
                            gpu = 'Available (no renderer info)';
                        }
                    } else {
                        gpu = 'WebGL not supported';
                    }
                } catch (e) {
                    gpu = 'Detection error';
                }
                info['WebGL 支持'] = webglSupport ? '是' : '否';
                info['GPU 信息'] = gpu;

                // NFC 支持
                info['NFC 支持'] = ('NDEFReader' in window) ? '是' : '否';

                // 电池状态（异步，先占位）
                info['电池状态'] = '正在获取…';

                // 是否 Webview
                var isWebview = /wv|WebView/i.test(ua) || (window.navigator.standalone === true);
                info['是否 Webview'] = isWebview ? '是' : '否';

                // 是否爬虫（简单关键字）
                var isRobot = /bot|crawler|spider|slurp|googlebot|bingbot|baiduspider/i.test(ua);
                info['是否爬虫'] = isRobot ? '是' : '否';

                // 字体列表（部分常见字体）
                try {
                    var fontList = [];
                    var testFonts = ['Arial', 'Helvetica', 'Times New Roman', 'Courier New', 'Georgia', 'Verdana', 'PingFang SC',
                        'Microsoft YaHei'
                    ];
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
                    var baseText = 'abcdefghijklmnopqrstuvwxyz';
                    var baseWidth = ctx.measureText(baseText).width;
                    testFonts.forEach(function(font) {
                        ctx.font = '16px ' + font + ', sans-serif';
                        var width = ctx.measureText(baseText).width;
                        if (width !== baseWidth) fontList.push(font);
                    });
                    info['可用字体（部分）'] = fontList.length ? fontList.join(', ') : '无法检测';
                } catch (e) {
                    info['可用字体（部分）'] = '检测失败';
                }

                // 指纹哈希
                var fingerprintStr = ua + screen.width + screen.height + (navigator.language || '') + (info['时区'] || '') +
                    (navigator.deviceMemory || '');
                var hash = 0;
                for (var i = 0; i < fingerprintStr.length; i++) {
                    var char = fingerprintStr.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                info['浏览器指纹 (简单哈希)'] = '0x' + (hash >>> 0).toString(16).padStart(8, '0');

                return info;
            }

            // ---------- 异步获取电池信息 ----------
            function getBatteryInfo(callback) {
                if (navigator.getBattery) {
                    navigator.getBattery().then(function(battery) {
                        var level = Math.round(battery.level * 100) + '%';
                        var charging = battery.charging ? '充电中' : '未充电';
                        callback('电量 ' + level + ' (' + charging + ')');
                    }).catch(function() {
                        callback('无法获取');
                    });
                } else {
                    callback('不支持 Battery API');
                }
            }

            // ---------- 渲染详细报告（无 emoji） ----------
            function renderDetails(info) {
                var container = document.getElementById('ua-details');
                if (!container) return;

                var html = '<table>';
                var sections = [
                    { title: '基础信息', keys: ['User-Agent', '浏览器', '渲染引擎', '操作系统', '平台', '设备类型'] },
                    { title: '屏幕与显示', keys: ['屏幕分辨率', '可用屏幕尺寸', '颜色深度', '像素深度', '设备像素比'] },
                    { title: '网络与语言', keys: ['语言', '时区', '是否在线', '网络类型', '下行速度', 'RTT'] },
                    { title: '硬件特性', keys: ['设备内存', '触屏支持', 'Cookie 启用', 'WebGL 支持', 'GPU 信息', 'NFC 支持', '电池状态'] },
                    { title: '其他信息', keys: ['是否 Webview', '是否爬虫', '可用字体（部分）', '浏览器指纹 (简单哈希)'] }
                ];

                sections.forEach(function(section) {
                    html += '<tr><td colspan="2" class="section-title">' + section.title + '</td></tr>';
                    section.keys.forEach(function(key) {
                        var value = info[key] || 'N/A';
                        value = String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        html += '<tr><td class="label">' + key + '</td><td class="value">' + value + '</td></tr>';
                    });
                });

                html += '</table>';
                container.innerHTML = html;
            }

            // ---------- 主流程 ----------
            function updateFooter() {
                var summary = document.getElementById('ua-summary');
                var toggleBtn = document.getElementById('ua-toggle');
                var detailsContainer = document.getElementById('ua-details');

                var bi = getBrowserInfo();
                var compatible = (typeof Promise !== 'undefined' && typeof fetch !== 'undefined' && typeof requestAnimationFrame !==
                    'undefined');
                var compatText = compatible ?
                    '<span class="ua-compatible">完全兼容</span>' :
                    '<span class="ua-incompatible">建议 <a href="https://wzml.cc.cd/old" target="_blank">访问旧版</a></span>';

                summary.innerHTML = '浏览器: ' + bi.browser + ' ' + bi.version + '  |  系统: ' + bi.os +
                    '  |  ' + compatText;

                var info = getDetailedInfo();

                getBatteryInfo(function(batteryStatus) {
                    info['电池状态'] = batteryStatus;
                    renderDetails(info);
                });

                renderDetails(info);

                var visible = false;
                toggleBtn.addEventListener('click', function() {
                    visible = !visible;
                    detailsContainer.style.display = visible ? 'block' : 'none';
                    toggleBtn.textContent = visible ? '收起详细报告' : '显示完整检测报告';
                });
            }

            if (window.addEventListener) {
                window.addEventListener('load', updateFooter, false);
            } else if (window.attachEvent) {
                window.attachEvent('onload', updateFooter);
            } else {
                window.onload = updateFooter;
            }
        })();
    </script>

    <!-- ========== 渲染卡片（使用提前定义的 categories） ========== -->
    <script>
        (function() {
            var container = document.getElementById('categoriesContainer');
            var customCursor = document.getElementById('customCursor');

            // ---------- 链接渲染（支持嵌套分组 / 文字组件 / setting） ----------
            function getGroupSetting(group) {
                if (group && typeof group === 'object' && group.setting && typeof group.setting === 'object') {
                    return group.setting;
                }
                return {};
            }

            function makeLinkButton(name, url) {
                var button = document.createElement('button');
                button.textContent = name;
                button.addEventListener('click', (function(u) {
                    return function(e) {
                        e.stopPropagation();
                        e.preventDefault();
                        window.open(u, '_blank');
                    };
                })(url));
                button.addEventListener('mouseup', function(e) { e.stopPropagation(); });
                button.addEventListener('mousedown', function(e) { e.stopPropagation(); });
                return button;
            }

            function makeTextItem(text) {
                var div = document.createElement('div');
                div.className = 'text-item';
                div.textContent = text;
                return div;
            }

            // 递归渲染一个分组；level 0 为卡片，>0 为嵌套子分组
            function appendGroup(parent, group, title, level) {
                var settings = getGroupSetting(group);
                var collapsible = settings.collapsible !== false;
                var collapsed = settings.collapsed === true;

                var wrap = document.createElement('div');
                wrap.className = level === 0 ? 'category-card' : 'sub-group';

                var header = document.createElement(level === 0 ? 'h3' : 'h4');
                header.className = level === 0 ? 'category-title' : 'sub-group-title';
                header.textContent = title;

                var marker = null;
                if (collapsible) {
                    header.classList.add('collapsible');
                    marker = document.createElement('span');
                    marker.className = 'group-marker';
                    marker.textContent = collapsed ? '▸' : '▾';
                    header.insertBefore(marker, header.firstChild);
                }

                var body = document.createElement('div');
                body.className = level === 0 ? 'category-body' : 'sub-group-body';
                if (collapsed) body.style.display = 'none';

                for (var key in group) {
                    if (!group.hasOwnProperty(key)) continue;
                    if (key === 'setting') continue;
                    var value = group[key];
                    if (typeof value === 'string') {
                        if (value.indexOf('[text]') === 0) {
                            body.appendChild(makeTextItem(value.slice(6)));
                        } else {
                            body.appendChild(makeLinkButton(key, value));
                        }
                    } else if (typeof value === 'object') {
                        appendGroup(body, value, key, level + 1);
                    }
                }

                wrap.appendChild(header);
                wrap.appendChild(body);
                parent.appendChild(wrap);

                if (collapsible) {
                    header.addEventListener('click', function() {
                        var isHidden = body.style.display === 'none';
                        body.style.display = isHidden ? '' : 'none';
                        marker.textContent = isHidden ? '▾' : '▸';
                    });
                }
            }

            function renderCategories() {
                container.innerHTML = '';
                for (var categoryName in categories) {
                    if (categories.hasOwnProperty(categoryName)) {
                        if (categoryName === 'setting') continue;
                        appendGroup(container, categories[categoryName], categoryName, 0);
                    }
                }
            }

            renderCategories();

            // 自定义光标（完全保留）
            var cursorX = 0,
                cursorY = 0;
            var cursorVisible = false;
            var rafId = null;
            var pendingX = 0,
                pendingY = 0;

            function updateCursorPosition() {
                customCursor.style.left = pendingX + 'px';
                customCursor.style.top = pendingY + 'px';
                rafId = null;
            }

            document.addEventListener('mousemove', function(event) {
                cursorX = event.clientX;
                cursorY = event.clientY;
                cursorVisible = true;
                customCursor.style.display = 'block';
                pendingX = cursorX;
                pendingY = cursorY;
                if (!rafId) {
                    rafId = requestAnimationFrame(updateCursorPosition);
                }
            }, { passive: true });

            document.addEventListener('mouseleave', function() {
                cursorVisible = false;
                customCursor.style.display = 'none';
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }
            });

            document.addEventListener('mouseenter', function(event) {
                cursorVisible = true;
                customCursor.style.display = 'block';
                cursorX = event.clientX;
                cursorY = event.clientY;
                pendingX = cursorX;
                pendingY = cursorY;
                if (!rafId) {
                    rafId = requestAnimationFrame(updateCursorPosition);
                }
            });

            document.addEventListener('contextmenu', function(event) {
                event.preventDefault();
            });

            document.addEventListener('touchmove', function(event) {
                if (event.touches.length > 0) {
                    cursorX = event.touches[0].clientX;
                    cursorY = event.touches[0].clientY;
                    cursorVisible = true;
                    customCursor.style.display = 'block';
                    pendingX = cursorX;
                    pendingY = cursorY;
                    if (!rafId) {
                        rafId = requestAnimationFrame(updateCursorPosition);
                    }
                }
            }, { passive: true });

            document.addEventListener('touchend', function() {
                setTimeout(function() {
                    if (!cursorVisible) {
                        customCursor.style.display = 'none';
                    }
                }, 1500);
            });

            cursorX = window.innerWidth / 2;
            cursorY = window.innerHeight / 2;
            customCursor.style.left = cursorX + 'px';
            customCursor.style.top = cursorY + 'px';
            customCursor.style.display = 'block';
            cursorVisible = true;
        })();
    </script>

    <!-- ========== 公告渲染（默认折叠） ========== -->
    <script>
        (function() {
            var panel = document.getElementById('announcementPanel');
            if (!panel) return;
            var header = document.getElementById('announcementHeader');
            var body = document.getElementById('announcementBody');
            var toggle = document.getElementById('announcementToggle');
            var list = document.getElementById('announcementList');
            var countSpan = document.getElementById('announcementCount');

            var items = (typeof announcements === 'object' && announcements !== null && announcements.length) ? announcements : [];
            countSpan.textContent = items.length + ' 条公告';

            for (var i = 0; i < items.length; i++) {
                var a = items[i] || {};
                var li = document.createElement('li');
                li.className = 'announcement-item';
                if (a.date) {
                    var d = document.createElement('span');
                    d.className = 'announcement-item-date';
                    d.textContent = a.date;
                    li.appendChild(d);
                }
                if (a.title) {
                    var t = document.createElement('span');
                    t.className = 'announcement-item-title';
                    t.textContent = a.title;
                    li.appendChild(t);
                }
                if (a.content) {
                    var c = document.createElement('div');
                    c.className = 'announcement-item-content';
                    c.textContent = a.content;
                    li.appendChild(c);
                }
                list.appendChild(li);
            }

            header.addEventListener('click', function() {
                var isHidden = body.style.display === 'none';
                body.style.display = isHidden ? '' : 'none';
                toggle.textContent = isHidden ? '▾ 收起' : '▸ 展开';
            });
        })();
    </script>
</body>
</html>
